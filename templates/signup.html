<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container mt-5">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            class="form-control mb-3"
            type="text"
            name="name"
            placeholder="Name"
            required
        >

        <input
            class="form-control mb-3"
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            class="form-control mb-3"
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <select
            class="form-control mb-3"
            name="role"
        >

            <option value="member">
                Member
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <button class="btn btn-success">
            Signup
        </button>

    </form>

</body>
</html>
