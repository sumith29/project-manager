<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container mt-5">

    <h1>Dashboard</h1>

    <h3>Welcome {{ user }}</h3>

    <h5>Role: {{ role }}</h5>

    <br>

    {% if role == "admin" %}

        <a href="/projects" class="btn btn-primary">
            Manage Projects
        </a>

        <br><br>

        <a href="/tasks" class="btn btn-success">
            Manage Tasks
        </a>

    {% else %}

        <h4>You are logged in as Member</h4>

        <a href="/tasks" class="btn btn-success">
            View Tasks
        </a>

    {% endif %}

</body>
</html>
